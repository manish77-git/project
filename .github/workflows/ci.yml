name: CI

# Quality gates for every push and pull request.
#
# Everything here is hermetic: the suites inject a fake OCR engine, a fake
# explanation provider and a fake HTTP transport, so no API key, database or
# network provider is needed. `scripts/live-smoke.ts` is deliberately NOT run —
# it makes real Gemini requests and only works with a configured key.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Loads the real Tesseract engine and may download traineddata on a cold
      # cache; the config already allows 180s per test and hook for that.
      - name: Real-OCR tests
        run: npm run test:ocr

      - name: Lint
        run: npm run lint

      # Next's route types (LayoutProps, PageProps, root params) are generated
      # into gitignored .next/types, so a fresh checkout cannot type-check until
      # they exist. This generates them without a full build.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
