name: Secret scan

# Gitleaks over the full commit history, because a secret that was committed and
# later deleted is still readable in history — a working-tree-only scan would
# miss exactly the case that matters.
#
# Deliberately read-only: PR comments and the SARIF artifact upload are both
# switched off below, so the job never needs `pull-requests: write`,
# `security-events: write` or `actions: write`. A push to a fork therefore
# cannot be used to write anything back to this repository.
#
# No GITLEAKS_LICENSE is set: this repository belongs to a personal account, and
# upstream documents the license as required only for organizations.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC. Catches leaks in older history and re-scans
    # after a rule update, neither of which a push trigger alone would find.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history (fetch-depth: 0) is required: Gitleaks scans commits, not
      # just the checked-out tree.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Read-only token, supplied automatically by GitHub Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
